name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests (Mockito) + integration tests (Testcontainers usa el Docker del runner)
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for kind in ("surefire", "failsafe"):
              totals = dict(tests=0, failures=0, errors=0, skipped=0)
              for f in glob.glob(f"target/{kind}-reports/TEST-*.xml"):
                  root = ET.parse(f).getroot()
                  for k in totals:
                      totals[k] += int(root.get(k, 0))
              print(f"::notice title={kind}::" + ", ".join(f"{k}={v}" for k, v in totals.items()))
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
