name: Release tag

# Al fusionar un PR release/X.Y.Z o hotfix/X.Y.Z en main,
# crea el tag vX.Y.Z sobre el merge commit y su GitHub Release.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: Tag release
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest

    steps:
      - name: Compute version from branch name
        id: version
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          VERSION="${HEAD_REF#*/}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La rama '$HEAD_REF' debe llamarse release/X.Y.Z o hotfix/X.Y.Z"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::El release $TAG ya existe"
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes
